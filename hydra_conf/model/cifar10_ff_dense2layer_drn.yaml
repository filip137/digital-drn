name: "sequential_digital_drn"

config:
  input_dim: 3072
  input_shape: [3, 32, 32]
  ff_activation: "tanh"
  ff_bias: true
  drn_non_linearity: "linear"
  mode: "asynchronous"
  voltage_amp: 1.0
  current_amp: 1.0
  weight_init_mode: "kaiming_uniform"
  learn_drive_scale: true
  init_drive_scale: 1.0
  quadratic_diode_param: {}
  exponential_diode_param: {}
  hard_sigmoid_param: {}

blocks_config:
  - ff:
      type: "conv"
      activation: "tanh"
      bias: true
      lr: 1.0e-3
      input_shape: [3, 32, 32]
      conv_channels: [32]
      conv_kernels: [3]
      conv_strides: [1]
      conv_paddings: [1]
      conv_pool_kernels: [null]

    drn:
      layer_dims: [128, 64, 10]
      weight_gains: [0.05, 0.05]
      bias_gain: 0.0
      weight_min: 1.0e-7
      weight_max: 10.0
      num_iterations: 4
      lr: 1.0e-3
